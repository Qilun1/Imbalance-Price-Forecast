[project]
name = "imbalance"
version = "0.1.0"
description = "Imbalance price forecast for the Since AI 2026 Turku Energia challenge"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "pyarrow>=14",
    "duckdb>=1.1",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/imbalance"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
