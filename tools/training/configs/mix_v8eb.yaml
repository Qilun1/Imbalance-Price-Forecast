# mix_v8eb: structural mixture P(direction) x P(spread | direction) on feature set v8 (v4 + UMM outage messages) (backend/imbalance/mixture.py)
name: mix_v8eb
feature_set: v8
blocks: [[1, 8], [9, 40]]        # lead-time blocks with their own conditional heads (steps, inclusive)
spikes: mixture        # spike probabilities from the mixture (alternatives: classifier, mean)
widen: 1.4             # held-out check: chosen per validation week on the other four weeks -> 1.3-1.5 (tools: widen check in EVALUATION)
regressor:
  n_estimators: 150
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 200
classifier:
  n_estimators: 110
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 200
# UMM event signals only (planned outages and nuclear level act as a season proxy)
drop_features: ["umm_planned_gen_mw", "umm_nuclear_mw"]
