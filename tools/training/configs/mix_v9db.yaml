# mix_v9db: as mix_v9b plus direction persistence and spike clustering (feature set v9d, features.add_dir_persistence); structural mixture P(direction) x P(spread | direction) (backend/imbalance/mixture.py)
name: mix_v9db
feature_set: v9d
blocks: [[1, 8], [9, 40]]        # lead-time blocks with their own conditional heads (steps, inclusive)
spikes: mixture        # spike probabilities from the mixture (alternatives: classifier, mean)
widen: 1.4             # held-out check: chosen per validation week on the other four weeks -> 1.3-1.5 (tools: widen check in EVALUATION)
regressor:
  n_estimators: 150
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 200
classifier:
  n_estimators: 110
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 200
