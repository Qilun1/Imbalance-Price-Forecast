# lgbm_v6ms: lgbm_v4ms + second NWP model wind and forecast disagreement (features.add_nwp_spread)
# v3: MET Nordic (MEPS 2.5 km, Single Runs) wind + population-weighted temperature.
name: lgbm_v6ms
feature_set: v6m
widen: 1.6            # same as v1 until re-tuned on validation
regressor:
  n_estimators: 150
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 200
classifier:
  n_estimators: 110
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 200
