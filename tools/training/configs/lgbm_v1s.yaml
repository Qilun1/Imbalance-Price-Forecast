# v1: package data only, LightGBM on the spread to spot.
name: lgbm_v1s
feature_set: v1
widen: 1.6            # P10/P90 distance from P50, multiplied; chosen on validation (coverage 0.79)
regressor:
  n_estimators: 150
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 200
classifier:
  n_estimators: 110
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 200
